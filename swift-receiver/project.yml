name: QRDrop
options:
  bundleIdPrefix: io.scummbar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  QRDrop:
    type: application
    platform: iOS
    sources: [QRDrop]
    info:
      path: QRDrop/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.scummbar.qrdrop
        TARGETED_DEVICE_FAMILY: "1"
  QRDropTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QRDropTests]
    dependencies:
      - target: QRDrop
